<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../darkmode.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login QR Code</title>

    <link rel="stylesheet" href="style.css">

    <!-- fontawesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../darkmode.css">
    <link rel="stylesheet" href="../BackButtons.css">
</head>
<body>

    <!-- top navigation -->
    <header class="navbar">

        <a class="logo" href="../BiteRushHomePage/index.html" aria-label="BiteRush home">
            <img src="./images/burger.png" alt="BiteRush logo">
            <h3 class="biterush-title">BiteRush</h3>
        </a>

        <div class="page-title">QR code Login</div>

    </header>


    <!-- main contents -->
    <main class="main">

        <!-- back button -->
        <a href="../Login/index.html" class="back-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        </a>


        <!-- left branding section -->
        <section class="brand-section">

            <img
                src="./images/burger.png"
                alt="BiteRush mascot"
                class="burger-mascot">

            <h1 class="biterush-center">BiteRush</h1>

            <p>Rush your cravings.</p>

        </section>


        <!-- qr login box -->
        <section class="qr-login-box">

            <h2>Log In with QR code</h2>

            <!-- qr code -->
            <div class="qr-code">
                <img
                    src="./images/qrcode.png"
                    alt="BiteRush QR code">
            </div>

            <p class="qr-description">
                QR sign-in is not available yet. Sign in with your username and password instead.
            </p>

            <p class="qr-instruction">
                Use your BiteRush account to sign in.
            </p>

            <a class="signup-prompt" href="../Login/index.html">Go to sign in</a>

            <p class="signup-prompt">
                New to BiteRush?
                <a href="../Login/SignUp.html">Sign up</a>
            </p>

        </section>

    </main>

</body>
</html>
